<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Awareness Lab - Love Animation &amp; Telemetry</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/ua-parser-js@1.0.37/dist/ua-parser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <!-- SCREEN 1: Form & Controls -->
  <section id="screen-1" class="screen screen-active">
    <div class="card-container">
      <div class="card">
        <div class="security-badge-header">
          <span class="badge-icon">🛡️</span>
          <span class="badge-text">Cybersecurity Awareness Demo</span>
        </div>

        <h1 class="card-title">Love Forever</h1>
        <p class="card-subtitle">Personalized animation &amp; sensor telemetry demo</p>

        <form id="names-form" novalidate>
          <div class="form-group">
            <label for="your-name">Your name</label>
            <input type="text" id="your-name" name="your_name" placeholder="e.g. Rahul" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label for="partner-name">Partner's name</label>
            <input type="text" id="partner-name" name="partner_name" placeholder="e.g. Priya" required autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="love-message">Dedication Note <span class="label-optional">(Optional)</span></label>
            <input type="text" id="love-message" name="message" placeholder="e.g. Forever together" maxlength="120" autocomplete="off" />
          </div>

          <!-- Theme Color Option -->
          <div class="form-group" style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">
            <label style="font-size: 0.8rem; margin-bottom: 6px; display: block; color: var(--text-secondary);">🎨 Theme Color Option</label>
            <select id="card-theme-select" style="width: 100%; background: #18181b; color: #fff; border: 1px solid var(--border-subtle); padding: 8px; border-radius: 4px; font-size: 0.85rem;">
              <option value="rose">Neon Rose (#ff6584)</option>
              <option value="crimson">Crimson Red (#ff334b)</option>
              <option value="sunset">Sunset Gold (#ffa15c)</option>
            </select>
          </div>

          <div id="form-error" class="form-error" role="alert" aria-live="polite"></div>

          <button type="submit" id="continue-btn" class="primary-btn">
            Launch Animation &amp; Transmit Telemetry
          </button>
        </form>

        <div class="card-bottom-nav">
          <a href="/admin" class="nav-admin-link">⚙ Open Instructor Admin Dashboard</a>
        </div>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: Animation & Export (No Box Background, Centered Inside Love Symbol) -->
  <section id="screen-2" class="screen screen-hidden">
    <div class="names-overlay" id="names-overlay" style="cursor: grab; touch-action: none; background: transparent; padding: 0; border: none; backdrop-filter: none; user-select: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 15;">
      <div id="names-display" class="names-heading" style="text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(255,101,132,0.6);"></div>
      <p id="wish-display" class="names-subtext" style="text-shadow: 0 0 15px rgba(0,0,0,0.8);">Together Always</p>
      <div style="font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-top: 6px;">↔ Drag to position inside symbol</div>
    </div>

    <div id="ui" aria-hidden="true"></div>

    <footer class="love-footer" style="display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; z-index: 20;">
      <button type="button" id="download-btn" class="footer-link-btn" style="background: rgba(255, 101, 132, 0.2); border: 1px solid #ff6584; padding: 10px 18px; border-radius: 8px; cursor: pointer; color: #fff; font-weight: 600;">📥 Download &amp; Share Animation</button>
      <button type="button" id="replay-btn" class="footer-link-btn">← New Demonstration</button>
    </footer>
  </section>

  <!-- Customization / Name & Phone Prompt Modal (Appears after permission launch) -->
  <div id="custom-prompt-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #18181b; padding: 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 380px; text-align: center;">
      <h3 style="color: #fff; margin-bottom: 6px;">✏️ Adjust Name Inside Symbol</h3>
      <p style="color: #a1a1aa; font-size: 0.8rem; margin-bottom: 14px;">Fine-tune your names &amp; enter mobile number to export (dummy number works)</p>
      
      <div style="text-align: left; margin-bottom: 10px;">
        <label style="font-size: 0.75rem; color: #a1a1aa; display: block; margin-bottom: 4px;">Custom Text / Names:</label>
        <input type="text" id="modal-custom-names" placeholder="e.g. Rahul ❤ Priya" style="width: 100%; padding: 9px; background: #09090b; border: 1px solid #27272a; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;" />
      </div>

      <div style="text-align: left; margin-bottom: 16px;">
        <label style="font-size: 0.75rem; color: #a1a1aa; display: block; margin-bottom: 4px;">Mobile Number:</label>
        <input type="text" id="modal-phone-input" placeholder="e.g. +91 9876543210" style="width: 100%; padding: 9px; background: #09090b; border: 1px solid #27272a; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 0.85rem;" />
      </div>

      <div style="display: flex; gap: 10px;">
        <button type="button" id="modal-cancel-btn" style="flex: 1; padding: 10px; background: #27272a; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
        <button type="button" id="modal-submit-btn" style="flex: 1; padding: 10px; background: #ff6584; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Save &amp; Download</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
