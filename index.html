<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Awareness Lab - Browser Fingerprinting &amp; Geolocation</title>
  <meta name="description" content="Educational cybersecurity lab demonstrating browser fingerprinting, Battery Status API exposure, and geolocation permissions." />
  <link rel="stylesheet" href="style.css" />
  <!-- UAParser library for client-side environment analysis -->
  <script src="https://unpkg.com/ua-parser-js@1.0.37/dist/ua-parser.min.js"></script>
  <!-- html2canvas library for snapshotting and downloading the card -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <!-- ========================================== -->
  <!-- SCREEN 1: Interactive Greeting & Form      -->
  <!-- ========================================== -->
  <section id="screen-1" class="screen screen-active" aria-label="Cybersecurity Demonstration Form">
    <div class="card-container">
      <div class="card">
        <div class="security-badge-header">
          <span class="badge-icon">🛡️</span>
          <span class="badge-text">Cybersecurity Awareness Demo</span>
        </div>

        <h1 class="card-title">Love Forever</h1>
        <p class="card-subtitle">Personalized love animation &amp; live security demonstration</p>

        <form id="names-form" novalidate>
          <div class="form-group">
            <label for="your-name">Your name</label>
            <input
              type="text"
              id="your-name"
              name="your_name"
              placeholder="e.g. Rahul"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="partner-name">Partner's name</label>
            <input
              type="text"
              id="partner-name"
              name="partner_name"
              placeholder="e.g. Priya"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="love-message">Dedication or Note <span class="label-optional">(Optional)</span></label>
            <input
              type="text"
              id="love-message"
              name="message"
              placeholder="e.g. Forever and always in my heart"
              autocomplete="off"
              maxlength="120"
            />
          </div>

          <div id="form-error" class="form-error" role="alert" aria-live="polite"></div>

          <button type="submit" id="continue-btn" class="primary-btn">
            Launch Animation &amp; Transmit Telemetry
          </button>
        </form>

        <div class="card-bottom-nav">
          <a href="/admin" class="nav-admin-link">⚙ Open Instructor Admin Dashboard</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- SCREEN 2: Love Animation                   -->
  <!-- ========================================== -->
  <section id="screen-2" class="screen screen-hidden" aria-label="Love Animation">
    <div class="names-overlay" id="names-overlay">
      <div id="names-display" class="names-heading"></div>
      <p id="wish-display" class="names-subtext">Together Always</p>
    </div>

    <div id="ui" aria-hidden="true"></div>

    <!-- Footer Controls: Download & Replay -->
    <footer class="love-footer" style="display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; z-index: 20;">
      <button type="button" id="download-btn" class="footer-link-btn" style="background: rgba(234, 128, 176, 0.2); border: 1px solid var(--accent-pink); padding: 8px 16px; border-radius: 8px; cursor: pointer; color: #fff;">📸 Download Card to Share</button>
      <button type="button" id="replay-btn" class="footer-link-btn">← New Demonstration</button>
    </footer>
  </section>

  <script src="script.js"></script>
</body>
</html>
